name: nephromind
description: "A Flutter application for kidney health management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.24.0

  # Firebase Services
  firebase_auth: ^4.13.0
  cloud_firestore: ^4.8.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.6.0

  # --- NEW ADDITIONS ---
  file_picker: ^8.0.7
  http: ^1.1.0

  # UI & Media
  cupertino_icons: ^1.0.8
  url_launcher: ^6.1.0
  cached_network_image: ^3.2.3
  share_plus: ^9.0.0

  # Utilities
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.68.0

  # Environment Variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env