name: nephromind
description: "A Flutter application for kidney health management"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core
  firebase_core: ^2.24.0  # Downgraded for compatibility

  # Firebase Services - Downgraded to compatible versions
  firebase_auth: ^4.13.0
  cloud_firestore: ^4.8.0
  firebase_storage: ^11.2.0
  firebase_messaging: ^14.6.0

  # UI & Media - Moved from dev_dependencies
  cupertino_icons: ^1.0.8
  url_launcher: ^6.1.0
  cached_network_image: ^3.2.3
  share_plus: ^9.0.0
  
  # Remove youtube_player_flutter temporarily to avoid conflicts
  # youtube_player_flutter: ^8.1.2
  
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true